{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — DailyExpense</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

  <div class="col-md-6 col-lg-5">

    <div class="card border-0 shadow rounded-4">

      <!-- HEADER -->
      <div class="card-header bg-success bg-gradient text-white text-center rounded-top-4 py-4">
        <i class="bi bi-person-plus-fill fs-2 mb-2 d-block"></i>
        <h4 class="fw-bold mb-0">Create Account</h4>
        <small class="opacity-75">Start tracking your expenses</small>
      </div>

      <!-- BODY -->
      <div class="card-body p-4">

        <!-- MESSAGES -->
        {% if messages %}
          {% for m in messages %}
            <div class="alert alert-{{ m.tags }} text-center py-2">
              {{ m }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <!-- USERNAME -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-person"></i>
              </span>
              <input type="text"
                     name="username"
                     class="form-control"
                     placeholder="Choose a username"
                     required>
            </div>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password"
                     name="password"
                     class="form-control"
                     placeholder="Create password"
                     required>
            </div>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-shield-check"></i>
              </span>
              <input type="password"
                     name="confirm"
                     class="form-control"
                     placeholder="Re-enter password"
                     required>
            </div>
          </div>

          <!-- REGISTER BUTTON -->
          <div class="d-grid">
            <button type="submit"
                    class="btn btn-success fw-bold rounded-pill py-2">
              <i class="bi bi-check-circle me-1"></i>
              Sign Up
            </button>
          </div>

        </form>

        <!-- LOGIN LINK -->
        <div class="text-center mt-4 small">
          Already have an account?
          <a href="{% url 'login' %}"
             class="fw-semibold text-decoration-none">
            Login here
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
