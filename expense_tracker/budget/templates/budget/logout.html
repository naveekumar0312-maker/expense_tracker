{% extends "budget/base.html" %}
{% block title %}Logout{% endblock %}
{% block page_title %}Logout{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">

    <div class="card border-0 shadow-lg rounded-4 text-center">

      <!-- HEADER -->
      <div class="card-header bg-danger bg-gradient text-white py-3 rounded-top-4">
        <div class="d-flex justify-content-center align-items-center gap-2">
          <i class="bi bi-box-arrow-right fs-4"></i>
          <h5 class="mb-0 fw-bold">Logged Out</h5>
        </div>
      </div>

      <!-- BODY -->
      <div class="card-body p-5">

        <!-- ICON -->
        <div class="mb-3">
          <i class="bi bi-shield-check fs-1 text-success"></i>
        </div>

        <p class="fs-5 fw-semibold mb-4">
          You have been successfully logged out
        </p>

        <p class="text-muted mb-4 small">
          Thank you for using <span class="fw-semibold">DailyExpense</span>.
          Come back anytime to manage your finances 
        </p>

        <!-- ACTION -->
        <a href="{% url 'login' %}"
           class="btn btn-success btn-lg fw-bold rounded-pill px-5">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Login Again
        </a>

      </div>
    </div>

  </div>
</div>

{% endblock %}
